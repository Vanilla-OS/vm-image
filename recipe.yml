name: Vanilla Desktop VM
id: vm
vibversion: 1.0.6

stages:
- id: build
  base: ghcr.io/vanilla-os/desktop:dev
  addincludes: true
  singlelayer: true
  labels:
    maintainer: Vanilla OS Contributors
  args:
    DEBIAN_FRONTEND: noninteractive
  runs:
    commands:
      - echo 'APT::Install-Recommends "1";' > /etc/apt/apt.conf.d/01norecommends

  modules:
  - name: init-setup
    type: shell
    commands:
    - lpkg --unlock
    - apt update

  - name: vm-tools
    type: apt
    sources:
      - packages:
        - open-vm-tools
        - open-vm-tools-desktop

  - name: virtualbox-guest-additions
    type: apt
    sources:
      - packages:
        - virtualbox-guest-utils
        - virtualbox-guest-x11
        only-arches: [amd64]

  - name: qemu
    type: apt
    sources:
      - packages:
        - qemu-guest-agent

  - name: spice
    type: apt
    sources:
      - packages:
        - spice-vdagent
        - spice-webdavd

  - name: cleanup
    type: shell
    commands:
    - apt autoremove -y
    - apt clean
    - lpkg --lock

  - name: fsguard
    type: fsguard
    FsGuardLocation: "/usr/sbin/FsGuard"
    CustomFsGuard: false
    GenerateKey: true
    FilelistPaths: ["/usr/bin"]
    modules:
      - name: remove-prev-fsguard
        type: shell
        commands:
          - rm -rf /FsGuard 
          - rm -f ./minisign.pub ./minisign.key 
          - chmod +x /usr/sbin/init
